# RBFE example: all paths are relative to this YAML file. The uncertainty
# columns contain one-sigma uncertainties of the reported edge means.
input_file: data.csv
output_file: expected.log
analysis_type: rbfe
energy_unit: kJ/mol
bootstrap_rounds: 1000
random_seed: 2026
significance_multiplier: 1.645

# Preferred orientation-independent RBFE metrics used by this project.
statistics:
  MAD: true
  RMSD: true
  taurx: true
  r22: true

# Report all unique simple cycles.
cycle_analysis: true
